<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodin the Warrior</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Chronicles of <span class="highlight">Nodin</span></h1>
        <p id="nodin-title"></p>
        <p id="nodin-origin"></p>
        <nav>
          <a href="/medo">Read about Medo the Champion</a>
        </nav>
      </section>

      <section class="card">
        <h2>Command Profile</h2>
        <ul id="profile-list"></ul>
      </section>

      <section class="card">
        <h2>Warrior Arsenal</h2>
        <ul id="weapon-list"></ul>
      </section>

      <section class="card">
        <h2>Campaign Milestones</h2>
        <ul id="milestone-list"></ul>
      </section>

      <section class="card">
        <h2>Current Mission</h2>
        <p id="nodin-mission"></p>
      </section>

      <footer>Powered by a Node.js backend API and a dynamic frontend.</footer>
    </main>

    <script src="/site.js" defer></script>
  </body>
</html>
