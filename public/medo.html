<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medo the Champion</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <h1><span class="highlight">Medo</span> the Champion</h1>
        <p id="medo-title"></p>
        <p id="medo-style"></p>
        <nav>
          <a href="/">Back to Nodin</a>
        </nav>
      </section>

      <section class="card">
        <h2>Champion Profile</h2>
        <ul id="medo-profile"></ul>
      </section>

      <section class="card">
        <h2>Legendary Feats</h2>
        <ul id="medo-feats"></ul>
      </section>

      <section class="card">
        <h2>Battle Loadout</h2>
        <ul id="medo-loadout"></ul>
      </section>

      <section class="card">
        <h2>Champion's Oath</h2>
        <blockquote id="medo-quote"></blockquote>
      </section>
    </main>

    <script src="/medo.js" defer></script>
